name: Deep Dig checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:games
      - run: npx playwright install --with-deps chromium
      - run: npm run check:deep-dig:submission
      - run: npm run check:deep-dig:picker
      - run: npm run check:deep-dig:browser
      - run: npm run check:deep-dig:idle
      - run: npm run check:deep-dig:styles
      - run: npm run build:deep-dig:submission
