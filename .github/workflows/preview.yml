name: Publish simulated preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deep-dig-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:games
      - run: npx playwright install --with-deps chromium
      - run: npm run check:deep-dig:submission
      - run: npm run check:deep-dig:picker
      - run: npm run build:deep-dig:submission
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: games/deep-dig/.friendsdk
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy simulated static preview
        id: deployment
        uses: actions/deploy-pages@v4
